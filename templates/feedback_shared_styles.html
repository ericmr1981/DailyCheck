{# 反馈模块共用样式（4 个页面 include 同一份，避免各页复制导致外观漂移）。
   状态色口径：待处理=橙、已忽略=灰、已派发=绿。 #}
<style>
  .feedback-list { display: grid; gap: 10px; }
  .feedback-card {
    display: block; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; text-decoration: none; color: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .feedback-card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .fc-head { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; }
  .fc-title { font-weight: 600; line-height: 1.35; word-break: break-word; }
  .fc-meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
  .fc-meta .sep { opacity: .5; }
  .fc-issue { color: var(--brand); font-weight: 600; }

  .feedback-status {
    flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; white-space: nowrap; border: 1px solid transparent;
  }
  .st-open       { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
  .st-ignored    { background: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
  .st-dispatched { background: #ecfdf5; color: #065f46; border-color: #6ee7b7; }

  .feedback-body {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.65;
  }
  .feedback-kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 13px; margin: 12px 0; }
  .feedback-kv dt { color: var(--muted); }
  .feedback-kv dd { margin: 0; word-break: break-word; }

  .feedback-comment {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--brand);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .feedback-comment.is-trigger { border-left-color: #16a34a; }
  .comment-head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .comment-body { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .trigger-tag {
    display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700;
    background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7;
    border-radius: 999px; padding: 1px 7px;
  }

  .feedback-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .feedback-actions form { margin: 0; width: auto; background: none; border: 0; padding: 0; }
  .feedback-actions button, .feedback-actions a.btn-secondary { width: auto; }
  .feedback-hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  /* 派发前的代码线索预览：管理员据此判断自动定位对不对，不对就补一句页面。 */
  .feedback-clue {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .feedback-clue-list { margin: 6px 0 0; padding-left: 18px; font-size: 12px; line-height: 1.7; }
  .feedback-clue-list code { font-size: 11px; word-break: break-all; }
  .feedback-warn {
    font-size: 12px; background: #fffbeb; border: 1px solid #fcd34d;
    color: #92400e; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px;
  }
</style>
