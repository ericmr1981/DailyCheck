# deploy/nginx/hook.kjtang.cn.snippet.conf
#
# DailyCheck Webhook 子域 nginx 片段 —— 把 hook.kjtang.cn:443 TLS 终结 + 转发到
# 127.0.0.1:8443（dc-webhook-receiver）。
#
# 完整部署（owner / Prod Agent 手动）：
#   1. 阿里云 DNS 加 A 记录：hook.kjtang.cn → 112.124.18.246
#   2. 阿里云 SSL 控制台重新签 DV 证书：
#      - 域名列表：kjtang.cn / www.kjtang.cn / hook.kjtang.cn
#      - 替换 /etc/nginx/ssl/kjtang.cn.pem 与 .key
#      - 验证：openssl x509 -in /etc/nginx/ssl/kjtang.cn.pem -noout -text | grep -A1 'Subject Alternative Name'
#   3. 在 /etc/nginx/sites-enabled/dailycheck 文件末尾追加本片段
#   4. nginx -t 验证语法
#   5. systemctl reload nginx
#   6. curl -I https://hook.kjtang.cn/health  # 应返回 200
#   7. 配置 GitHub repo Webhook（详见 systemd unit 注释）
#
# 设计：
#   - 流量隔离：hook.kjtang.cn 与 kjtang.cn 主站独立 server block，独立限速
#   - TLS 复用：证书跟主站同 SAN，运维简单
#   - 限速：防 webhook 滥刷
#   - 不缓存：webhook 端点不应被任何缓存层缓存

# === hook.kjtang.cn:443 —— GitHub Webhook 入口（流量隔离 + 防滥刷） ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hook.kjtang.cn;

    # TLS（与主站同证书，SAN 含 hook.kjtang.cn）
    ssl_certificate     /etc/nginx/ssl/kjtang.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/kjtang.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（与主站一致）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 不缓存 webhook 端点
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/hook.kjtang.cn.access.log;
    error_log  /var/log/nginx/hook.kjtang.cn.error.log;

    # 限速：每秒 30 个新连接，burst 60（GitHub webhook 正常 < 1/s，但留余量）
    # 限的是客户端 IP（X-Forwarded-For 头会被 GitHub 覆盖，nginx 默认用 client IP）
    limit_req_zone $binary_remote_addr zone=hook:10m rate=30r/s;
    limit_req zone=hook burst=60 nodelay;

    # 拒 GET 非 /health（GitHub webhook 走 POST）
    location = /health {
        # /health GET 是 receiver 探活端点，proxy_pass 到后端
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;  # 健康检查不打日志（避免日志膨胀）
    }

    location = /webhook {
        # 限 POST（GitHub 只发 POST；其他方法直接 405）
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GitHub webhook 关键：保留原始 body（验签要算 body 的 HMAC）
        proxy_pass_request_body on;
        proxy_request_buffering on;  # 先收完整 body 再转发（避免边收边算 HMAC）
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 其他路径：404（防探测）
    location / {
        return 404;
    }
}

# === hook.kjtang.cn:80 —— HTTP → HTTPS 强制 301（与主站一致） ===
server {
    listen 80;
    listen [::]:80;
    server_name hook.kjtang.cn;
    access_log /var/log/nginx/hook.kjtang.cn.access.log;
    error_log  /var/log/nginx/hook.kjtang.cn.error.log;
    # 让 /.well-known/ 在 HTTP 上也能用（证书续签 / 静态校验等场景）
    location ~ ^/\.well-known/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
