# /etc/nginx/sites-enabled/hook.kjtang.cn
#
# hook.kjtang.cn —— GitHub Webhook 入口（DailyCheck，独立于蓝绿主站 conf）
#
# 设计：
#   - 独立文件：与 /etc/nginx/sites-enabled/dailycheck（蓝绿主站）解耦，
#     switch.sh 布局守卫只检查 dailycheck 文件，本文件不受影响
#   - 流量隔离：独立 server block + 独立限速 + 独立日志
#   - TLS：独立证书 /etc/nginx/ssl/hook.kjtang.cn.{pem,key}（阿里云免费 DV，90 天轮换）
#   - 后端：dc-webhook-receiver.service（gunicorn，127.0.0.1:8443）
#
# 部署：cp 到 /etc/nginx/sites-enabled/hook.kjtang.cn → nginx -t → systemctl reload nginx
# 验证：curl -I https://hook.kjtang.cn/health   # 期望 200
#
# ⚠️ 部署前核对（2026-10-16 首次部署踩坑记录，详见 docs/2026-10-15-webhook-setup.md §2）：
#   1. 证书必须是**独立** hook 证书（阿里云免费"个人测试证书"= 单域名产品，
#      无法给主站证书加 SAN）；路径 /etc/nginx/ssl/hook.kjtang.cn.{pem,key}
#   2. 443 入站必须在防火墙放行（ufw 残留链 INPUT policy DROP 且放行清单缺 443 →
#      VPS 本机 curl 走 lo 被直通仍 200，外网全 502/超时；必须外部 vantage 复验）
#   3. limit_req_zone 只能在 http 上下文声明（本文件顶部），放 server{} 内 nginx -t 报错
#   4. 本文件独立部署，勿把内容追加进 /etc/nginx/sites-enabled/dailycheck

# limit_req_zone 只能在 http 上下文声明（sites-enabled/* 由 http 块 include）
limit_req_zone $binary_remote_addr zone=hook:10m rate=30r/s;

# === hook.kjtang.cn:443 —— GitHub Webhook 入口 ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hook.kjtang.cn;

    # TLS（独立证书，SAN = hook.kjtang.cn / www.hook.kjtang.cn）
    ssl_certificate     /etc/nginx/ssl/hook.kjtang.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/hook.kjtang.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSLHOOK:10m;
    ssl_session_timeout 1d;

    # 安全响应头（与主站一致）
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 不缓存 webhook 端点
    add_header Cache-Control "no-store" always;

    access_log /var/log/nginx/hook.kjtang.cn.access.log;
    error_log  /var/log/nginx/hook.kjtang.cn.error.log;

    # 限速：每秒 30 个新连接，burst 60（GitHub webhook 正常 < 1/s，留余量）
    limit_req zone=hook burst=60 nodelay;

    # /health GET 探活端点
    location = /health {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;  # 健康检查不打日志（避免日志膨胀）
    }

    location = /webhook {
        # 限 POST（GitHub 只发 POST；其他方法直接 405）
        limit_except POST {
            deny all;
        }
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GitHub webhook 关键：保留原始 body（验签要算 body 的 HMAC）
        proxy_pass_request_body on;
        proxy_request_buffering on;  # 先收完整 body 再转发（避免边收边算 HMAC）
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 其他路径：404（防探测）
    location / {
        return 404;
    }
}

# === hook.kjtang.cn:80 —— HTTP → HTTPS 强制 301 ===
server {
    listen 80;
    listen [::]:80;
    server_name hook.kjtang.cn;
    access_log /var/log/nginx/hook.kjtang.cn.access.log;
    error_log  /var/log/nginx/hook.kjtang.cn.error.log;
    # 让 /.well-known/ 在 HTTP 上也能用（证书续签 / 静态校验等场景）
    location ~ ^/\.well-known/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
