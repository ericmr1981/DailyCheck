<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登录 · 库存管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=12" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>登录</h1>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
      <ul class="flash-list">
        {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
      </ul>
      {% endif %}
    {% endwith %}
    <form method="post" action="{{ url_for('auth.login', next=next_url or None) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {# 深链回跳双保险：action 已带 next 查询串；隐藏域保证即使 action 丢 query
           （或浏览器/代理重写了 action）POST 仍能拿到原始目标。
           next_url 由视图传入，且已过 _safe_next —— 未校验值不进 HTML。 #}
        <input type="hidden" name="next" value="{{ next_url or '' }}">
      <label>账号
        <input name="username" required autofocus autocomplete="username" />
      </label>
      <label>密码
        <input name="password" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn primary">登录</button>
    </form>
  </main>
</body>
</html>
