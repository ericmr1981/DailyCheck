# DailyCheck 蓝绿 nginx 布局 — 单 upstream 模型（Issue #32 Option 2，2026-10-15 定稿）
#
# 设计铁律：
#   1. location 的 proxy_pass 永远指向合并 upstream（dailycheck / dailycheck-mcp），
#      切流量只改 server 行的 weight/down —— switch.sh 不碰 location。
#      （旧布局 location 硬编码 dailycheck-blue/green，upstream 切了流量不动 → 502）
#   2. 灰度真实生效：nginx 在同一 upstream 内按 weight 在蓝绿间分流。
#   3. nginx 1.24 不接受 weight=0；不参与负载的端用 `down`。
#
# Prod Agent 重构 /etc/nginx/sites-enabled/dailycheck 时以此模板为准
# （站点特有项按实调整），顺序：备份到 BACKUP_DIR → 覆写 → nginx -t → reload。

upstream dailycheck {
    server 127.0.0.1:8090 weight=100;  # blue
    server 127.0.0.1:8091 down;        # green（up.sh 起绿后由 switch.sh 启用）
}

upstream dailycheck-mcp {
    server 127.0.0.1:5100 weight=100;  # blue-mcp
    server 127.0.0.1:5101 down;        # green-mcp
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20m;
    access_log /var/log/nginx/dailycheck.access.log;
    error_log  /var/log/nginx/dailycheck.error.log;

    location ~ /\.(?!well-known) {
        return 404;
    }
    location ~* \.(php|asp|aspx|xjsp|cgi|bak|sql|log|env|ini)$ {
        return 403;
    }

    location /api/mcp/ {
        proxy_pass http://dailycheck-mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://127.0.0.1:5100/ http://$http_host/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://dailycheck;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://127.0.0.1:8090/ http://$http_host/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
